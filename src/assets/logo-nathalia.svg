<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9E9B2"/>
      <stop offset="0.42" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8E6B14"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F7CDDC"/>
      <stop offset="0.5" stop-color="#C77A9C"/>
      <stop offset="1" stop-color="#963B5E"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo suave -->
  <circle cx="256" cy="254" r="230" fill="url(#halo)"/>

  <!-- Anillos concéntricos -->
  <circle cx="256" cy="254" r="184" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.35"/>
  <circle cx="256" cy="254" r="172" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.9"/>
  <circle cx="256" cy="254" r="160" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="0.5 9" stroke-linecap="round" opacity="0.55"/>

  <!-- Monograma N (una sola línea plegada, estilo bisutería) -->
  <path
    d="M164 148 L150 342 L356 148 L342 342"
    fill="none"
    stroke="url(#gold)"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Diamante colgante en el centro (el corazón del monograma) -->
  <g transform="translate(253 240)">
    <rect
      x="-46"
      y="-46"
      width="92"
      height="92"
      transform="rotate(45)"
      fill="url(#rose)"
      stroke="#FFF7FB"
      stroke-width="5"
      rx="16"
    />
    <rect
      x="-46"
      y="-46"
      width="92"
      height="92"
      transform="rotate(180 0 0)"
      fill="none"
      stroke="url(#gold)"
      stroke-width="2.5"
      opacity="0.55"
    />
    <circle cx="0" cy="0" r="9" fill="#FFF3E0" opacity="0.95"/>
    <circle cx="0" cy="0" r="3.5" fill="url(#gold)"/>
  </g>

  <!-- Destellos -->
  <g fill="url(#rose)">
    <path d="M84 92 l8 13 13 8 -13 8 -8 13 -8 -13 -13 -8 13 -8 z"/>
  </g>
  <g fill="url(#gold)">
    <path d="M438 356 l7 11 11 7 -11 7 -7 11 -7 -11 -11 -7 11 -7 z"/>
    <circle cx="96" cy="392" r="6"/>
    <circle cx="418" cy="128" r="5"/>
  </g>
  <g fill="url(#rose)" opacity="0.7">
    <circle cx="160" cy="462" r="5"/>
  </g>
</svg>